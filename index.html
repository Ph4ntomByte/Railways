<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Railway Puzzle Game</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="menu">
    <label for="playerName">Name:</label>
    <input type="text" id="playerName" required>
    <br>
    <label for="difficulty">Map Difficulty:</label>
    <select id="difficulty">
      <option value="easy">Easy</option>
      <option value="hard">Hard</option>
    </select>
    <br>
    <button onclick="startGame()">Start Game</button>
    <button onclick="showRules()">Show Rules</button>
    <div id="leaderboard" class="hidden"></div>
  </div>

  <div id="game" class="hidden">
    <h2>Player: <span id="playerDisplay"></span></h2>
    <div id="timer">0</div>
    <div id="gameContainer"></div>
    <button onclick="endGame()">End Game</button>
  </div>

  <div id="rulesPopup" class="hidden">
    <h2>Game Rules</h2>
    <p>Here are the rules of the game...</p>
    <button onclick="closeRules()">Close</button>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
