<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Railway Puzzle Game</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="menu">
  <div class="centered">
    <input type="text" id="playerName" placeholder="WHO ARE YOU?" required>
  </div>
  <div id="menuOptionsContainer">
    <div id="difficultyContainer">
      <div id="difficultyText">SET THE DIFFICULTY!</div>
      <div class="difficultyOption" id="easyOption">
        <div class="difficultyBox" id="box5x5">5x5</div>
        <div class="difficultyLabel" id="easyLabel">EASY</div>
      </div>
      <div class="difficultyOption" id="hardOption">
        <div class="difficultyBox" id="box7x7">7x7</div>
        <div class="difficultyLabel" id="hardLabel">HARD</div>
      </div>
    </div>
    <div id="buttonsContainer">
      <button id="showRulesButton">Show Rules</button>
      <button id="startGameButton">Start Game</button>
    </div>
  </div>
  <div id="leaderboard" class="hidden"></div>
</div>
  <div id="game" class="hidden">
    <h2>Player: <span id="playerDisplay"></span></h2>
    <div id="timer">0</div>
    <div id="gameContainer"></div>
    <button id="endGameButton">End Game</button>
    <button id="restartGameButton">Back to Menu</button>
  </div>
  <div id="leaderboardPopup" class="hidden">
    <h2>Leaderboard</h2>
    <div id="leaderboard"></div>
    <button id="closeLeaderboardButton">Close</button>
  </div>
  <div id="rulesPopup" class="hidden">
    <h2>Game Rules</h2>
    <p>The game is played on a square grid of various sizes, where the goal is to create a continuous circular railway line that reaches every place where the train can travel.</p>
    <button id="closeRulesButton">Close</button>
  </div>
  <div id="incompleteGamePopup" class="hidden">
    <p>The puzzle is not solved correctly</p>
    <button id="closeIncompleteGamePopup">Close</button>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
