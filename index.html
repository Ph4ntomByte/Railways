<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Kingdom's Railway Network</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="menu" class="screen">
        <h1>The Kingdom's Railway Network</h1>
        <label for="player-name">Player Name:</label>
        <input type="text" id="player-name">
        <label for="difficulty">Map Difficulty:</label>
        <select id="difficulty">
            <option value="easy">Easy</option>
            <option value="hard">Hard</option>
        </select>
        <button onclick="startGame()">Start Game</button>
        <button onclick="showDescription()">Game Description</button>
        <div id="leaderboard" class="hidden">
            <h2>Leaderboard</h2>
            <ul id="leaderboard-list"></ul>
        </div>
    </div>

    <div id="game" class="screen hidden">
        <div id="game-grid"></div>
        <button onclick="returnToMenu()">Back to Menu</button>
    </div>

    <div id="description" class="hidden">
        <h2>Game Description</h2>
        <p>Help Trickles create a circular railway through various terrains...</p>
        <button onclick="hideDescription()">Close</button>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
